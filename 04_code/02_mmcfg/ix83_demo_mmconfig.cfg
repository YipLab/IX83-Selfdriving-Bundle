# IX83-Automation: demo camera and XYZ stages only.
# Based on the DemoCamera device names in the installed MMConfig_demo.cfg.
# Load this file in the Micro-Manager GUI for Pycro-Manager ZMQ testing.
# Camera: Camera; XY stage: XYStage; Z/focus stage: ZStage.

# Reset
Property,Core,Initialize,0

# Devices
Device,DHub,DemoCamera,DHub
Device,Camera,DemoCamera,DCam
Device,XYStage,DemoCamera,DXYStage
Device,ZStage,DemoCamera,DStage

# Initialize
Property,Core,Initialize,1

# Roles
Property,Core,Camera,Camera
Property,Core,XYStage,XYStage
Property,Core,Focus,ZStage
Property,Core,AutoShutter,0

# A minimal channel preset for acquisition clients.
ConfigGroup,Channel,Demo,Camera,Binning,1
