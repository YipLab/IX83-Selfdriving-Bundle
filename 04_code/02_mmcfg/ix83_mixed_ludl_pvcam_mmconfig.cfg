# IX83-Automation: Ludl XY stage, PVCAM camera, demo Z focus and Arduino laser shutters.
# Shutter labels, serial protocol and colours presets are copied from ix83_full_mmconfig.cfg.
# ZStage is retained from ix83_demo_mmconfig.cfg.
# Hardware profile only. Do not load unless the matching devices are connected.

