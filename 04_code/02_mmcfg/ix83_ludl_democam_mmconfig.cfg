# IX83-Automation: reference profile for the Ludl XY stage with DemoCamera and demo Z.
# The RedSun runtime now composes this stage stack from its session arguments;
# this file remains a settings record and is not loaded by that service.
# Core wait timeout and serial AnswerTimeout are distinct settings.
# No stage speed, acceleration, origin, homing or position is set by this file.

Property,Core,Initialize,0

# Devices
Device,COM22,SerialManager,COM22
Device,LudlController,Ludl,LudlController
Device,XYStage,Ludl,XYStage
Device,DHub,DemoCamera,DHub
Device,Camera,DemoCamera,DCam
Device,ZStage,DemoCamera,DStage

# COM22 settings retained from ix83_mixed_ludl_pvcam_mmconfig.cfg.
# This is a per-response serial timeout in milliseconds, not the motion wait limit.
Property,COM22,AnswerTimeout,50000.0000
Property,COM22,BaudRate,9600
Property,COM22,DTR,Disable
Property,COM22,DataBits,8
Property,COM22,DelayBetweenCharsMs,0.0000
Property,COM22,Fast USB to Serial,Disable
Property,COM22,Handshaking,Off
Property,COM22,Parity,None
Property,COM22,StopBits,2
Property,COM22,Verbose,1
Property,LudlController,Port,COM22

Property,Core,Initialize,1

# Core roles: real XY, simulated camera and focus, no automatic shutter.
Property,Core,Camera,Camera
Property,Core,XYStage,XYStage
Property,Core,Focus,ZStage
Property,Core,AutoShutter,0

# Separate MMCore wait/busy deadline, verified configurable above 5000 ms in Core 12.5.
# It does not stop the stage or guarantee a controller response after a timeout.
Property,Core,TimeoutMs,60000

# Demo-camera-only acquisition preset; PVCAM-specific storm settings do not apply.
ConfigGroup,Channel,Demo,Camera,Binning,1
