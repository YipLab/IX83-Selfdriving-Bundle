# ix71 MMCore reference configuration: ASI XY stage and DemoCamera only.
# Generated manually from the observed COM5 8N1 115200 link; no Z stage,
# illumination, shutter or PVCAM device is declared.
# This profile is a comparison/reference path. Redsun uses its native
# asi-serial-stage service by default.
#
# Close MMStudio or any other client that owns COM5 before loading this.

# Reset
Property,Core,Initialize,0

# Devices
Device,COM5,SerialManager,COM5
Device,XYStage,ASIStage,XYStage
Device,DCam,DemoCamera,DCam

# Pre-init settings for devices
Property,XYStage,Port,COM5

# Pre-init settings for COM ports
Property,COM5,AnswerTimeout,500.0000
Property,COM5,BaudRate,115200
Property,COM5,DTR,Disable
Property,COM5,DataBits,8
Property,COM5,DelayBetweenCharsMs,0.0000
Property,COM5,Fast USB to Serial,Disable
Property,COM5,Handshaking,Off
Property,COM5,Parity,None
Property,COM5,StopBits,1
Property,COM5,Verbose,1

# Initialize
Property,Core,Initialize,1

# Roles
Property,Core,Camera,DCam
Property,Core,AutoShutter,0

# PixelSize settings
# 60x objective with an 11 um camera pixel: 11 / 60 = 0.1833 um at 1x1.
# Nominal only. Stage/image registration on this system measured ~0.092-0.106
# um/px, a system 4f magnification of roughly 1.9x (95% 1.7-2.1x) whose source
# is not yet identified. Keep 0.1833 as the nominal preset; do not treat it as calibrated
# geometry until that 4f factor is confirmed (challenge it if new data says so).
# Resolution preset: Res60x
ConfigPixelSize,Res60x,Objective,Label,Olympus 60X
PixelSize_um,Res60x,0.1833
PixelSizeAngle_dxdz,Res60x,0.0
PixelSizeAngle_dydz,Res60x,0.0
PixelSizeOptimalZ_Um,Res60x,0.0
